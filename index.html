     ${dr>=7?html`<div style=${{textAlign:"center",padding:16,background:LG,borderRadius:10}}><div style=${{fontWeight:800}}>Draft complete. Rosters are locked.</div><div className="fine" style=${{marginTop:6}}>Undrafted: ${undrafted.join(", ")||"None"}</div></div>`:null}
    </div>`}
   </div>`:null}

   ${tab==="cup"?html`<div style=${{animation:"fadeIn .25s"}}>
    <div className="card" style=${{marginBottom:12}}><${Hd} r=${"$75 pot · final "+CUP_FINAL}>NBA CUP</${Hd}><div style=${{padding:"12px 16px"}}>
     <div className="fine" style=${{color:N,fontWeight:600,lineHeight:1.45}}>Group games and the bracket come from the ESPN scoreboard. A team is alive for the $75 pot when its manager still owns a club that can win the Cup. Nothing here is filled in when ESPN hasn't posted it.</div>
     <div className="fine" style=${{marginTop:8,color:GY,fontWeight:700}}>${cupSrc.error&&cupCache?"Last successful Cup update "+stamp(cupSrc.at)+" · not current":cupSrc.at?"Updated "+stamp(cupSrc.at):"Checking ESPN for NBA Cup games"}</div>
    </div></div>
    ${cupSrc.error?html`<div className="alert" role="alert">
     <div><strong>${cupCache?"Cup update failed":"NBA Cup data isn't available"}</strong>
     <p>${cupCache?"ESPN didn't respond. Showing the last Cup payload from "+stamp(cupSrc.at)+".":"ESPN didn't return NBA Cup games for the 2026-27 dates, so group standings and the bracket are not shown."}</p></div>
     <button type="button" className="retry-btn" onClick=${syncNow}>Retry</button>
    </div>`:null}
    ${!cupModel.groupGames&&!cupModel.knockout.length?html`<div className="card" style=${{padding:16}}><div className="fine" style=${{fontWeight:700}}>No NBA Cup games are in the feed yet.</div></div>`:null}
    ${cupModel.winner?html`<div className="champ">
     <div className="eyebrow">NBA Cup champion · ${CUP_FINAL}</div>
     <div className="who"><${Tm} name=${cupModel.winner.name} sz=${28} /></div>
     <div className="sub">${ownerOf(cupModel.winner.name)==="Undrafted"?"No manager owns "+cupModel.winner.name+". The $75 pot has no winner in this league.":ownerOf(cupModel.winner.name)+" wins the $75 Cup pot."}</div>
    </div>`:html`<div className="card" style=${{marginBottom:12,padding:"12px 16px"}}>
     <div className="fine" style=${{fontWeight:800}}>No Cup champion yet.</div>
     <div className="fine" style=${{color:GY,marginTop:4}}>${cupModel.champ?"Championship is on the ESPN scoreboard"+(cupModel.champ.venue?" at "+cupModel.champ.venue:"")+" · "+(cupModel.champ.status||"time TBA")+". Teams: "+(cupModel.champ.teams.map(function(t){return t.name||"TBD"}).join(" vs ")+"."):"ESPN has not posted the championship game on these dates."} The $75 pot is unawarded.</div>
    </div>`}
    ${cupModel.groups.length?html`<div className="cup-grid">
     ${cupModel.groups.map(function(g){return html`<div key=${g.name} className="card">
      <${Hd} r=${g.complete?"Group complete":g.remaining+" game"+(g.remaining===1?"":"s")+" left"}>${g.name.toUpperCase()}${g.labeled?"":" · label unmatched"}</${Hd}>
      <table style=${{width:"100%"}}><thead><tr style=${{background:LN}}>
       ${["TEAM","MGR","W-L","DIFF","STK"].map(function(h){return html`<th key=${h} className="fine" style=${{padding:"6px 8px",fontWeight:800,textAlign:h==="TEAM"||h==="MGR"?"left":"center"}}>${h}</th>`})}
      </tr></thead><tbody>
       ${g.teams.map(function(t){var own=ownerOf(t.name);var status=t.clinched?"Clinched group":g.complete?(t.rank===1?(t.tiedKeys?"Tied for the group":"Group winner"):"Did not win group"):t.outOfGroup?"Can't catch the leader":"Alive";return html`<tr key=${t.name} style=${{background:t.rank===1?LG:"var(--paper)"}}>
        <td style=${{padding:"6px 8px",fontSize:13}}><${Tm} name=${t.name} sz=${16} /><div className="badge" style=${{color:GY}}>${status}</div></td>
        <td className="fine" style=${{padding:"6px 8px",fontWeight:800,color:own==="Undrafted"?GY:mgrText(own)}}>${own==="Undrafted"?html`<span>Undrafted</span>`:html`<span style=${{display:"inline-flex",alignItems:"center",gap:4}}><${Crest} name=${own} sz=${18} /> ${own}</span>`}</td>
        <td style=${{textAlign:"center",fontWeight:800}}>${t.w}-${t.l}</td>
        <td className="fine" style=${{textAlign:"center",fontWeight:800,color:t.diff>0?GR:t.diff<0?RD:GY}}>${t.diff>0?"+":""}${t.diff}</td>
        <td style=${{textAlign:"center"}}><${Stk} v=${t.streak} /></td>
       </tr>`})}
      </tbody></table>
     </div>`})}
    </div>`:null}
    ${cupModel.groups.length?html`<div className="fine" style=${{color:GY,margin:"8px 0 14px"}}>Group order is wins, then point differential, then points scored, using the final score ESPN reports. When those match, the NBA still applies head-to-head, which this page does not break. ${cupModel.groups.some(function(g){return !g.labeled})?"One or more groups did not match the published letter groups, so that letter is hidden.":"Group letters match the published groups."}</div>`:null}
    <div className="card"><${Hd} r="Dec 4–5 · Dec 8 · Dec 11">KNOCKOUT BRACKET</${Hd}><div style=${{padding:"8px 14px"}}>
     ${cupModel.knockout.length===0?html`<div className="fine" style=${{padding:"8px 0"}}>Knockout games are not in the ESPN feed yet.</div>`:cupModel.knockout.map(function(g){
      var names=g.teams.map(function(t){return t.name||"TBD"});
      var line=g.completed&&names[0]!=="TBD"&&names[1]!=="TBD"?names.map(function(n,i){return n+" "+g.teams[i].score}).join(" · "):names.join(" vs ");
      return html`<div key=${g.id} style=${{padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
       <div className="fine" style=${{fontWeight:800,color:G}}>${g.kind}</div>
       <div style=${{fontWeight:700}}>${line}</div>
       <div className="fine" style=${{color:GY}}>${g.status||""}${g.venue?" · "+g.venue:""}${g.completed?"":" · matchup not final"}</div>
       ${g.completed&&g.teams.some(function(t){return t.name})?html`<div className="fine" style=${{marginTop:2}}>${g.teams.filter(function(t){return t.name}).map(function(t){return t.name+" · "+ownerOf(t.name)}).join(" · ")}</div>`:null}
      </div>`;
     })}
     ${["East","West"].map(function(conf){var info=confAlive(conf);return html`<div key=${conf} className="fine" style=${{padding:"8px 0"}}>
      ${info?html`<b>${conf} advances:</b> ${info.winners.join(", ")||"group tie not broken here"}${info.wild?" · wild card "+info.wild+" ("+ownerOf(info.wild)+")":" · wild card tie not broken here"}`:html`<b>${conf}:</b> group play is not complete, so the wild card and the quarterfinal field are not decided.`}
     </div>`})}
    </div></div>
   </div>`:null}

   ${tab==="history"?html`<div style=${{animation:"fadeIn .25s"}}>
    <div className="card">
     <${Hd} r="ARCHIVE">2025-26 SEASON RESULTS</${Hd}>
     <div className="fine" style=${{padding:"8px 16px",background:LG,fontWeight:700}}>Final standings from last season. This is not the 2026-27 race.</div>
     <table style=${{width:"100%"}}>
      <thead><tr style=${{background:LN}}>${["RK","MANAGER","WINS","BEST TEAM","ROSTER"].map(function(h){return html`<th key=${h} className="fine" style=${{padding:"10px 12px",fontWeight:800,textAlign:h==="MANAGER"||h==="ROSTER"?"left":"center"}}>${h}</th>`})}</tr></thead>
      <tbody>${HIST_2526.map(function(m){return html`<tr key=${m.rk} style=${{background:m.color}}>
       <td style=${{padding:"12px",textAlign:"center",fontWeight:800,fontSize:18,color:m.rk===1?G:N,fontFamily:"'Oswald','Arial Narrow',sans-serif"}}>${m.rk}</td>
       <td style=${{padding:"12px",fontWeight:700}}><span style=${{display:"inline-flex",alignItems:"center",gap:6}}><${Crest} name=${m.name.indexOf("Gallup")===0?"Gallup":m.name} sz=${22} /> ${m.name}${m.rk===1?" 🏆":""}</span></td>
       <td style=${{textAlign:"center",fontWeight:800,fontSize:18,color:GR,fontFamily:"'Oswald','Arial Narrow',sans-serif"}}>${m.w}</td>
       <td className="fine" style=${{textAlign:"center",fontWeight:700}}>${m.best}</td>
       <td className="fine" style=${{padding:"12px",color:GY}}>${m.teams}</td>
      </tr>`})}</tbody>
     </table>
     <div style=${{padding:"12px 16px",background:LN,display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
      <span className="fine" style=${{fontWeight:800}}>Undrafted: Jazz (22W), Wizards (17W)</span>
      <span className="fine" style=${{color:GY}}>Margin of Victory: 1 win</span>
     </div>
    </div>
   </div>`:null}

   ${tab==="rules"?html`<div style=${{animation:"fadeIn .25s"}}>
    <div className="card">
     <div style=${{background:"var(--bar)",padding:"16px 24px",borderBottom:"4px solid var(--bar-accent)"}}><span style=${{color:"var(--on-bar)",fontSize:16,fontWeight:800,letterSpacing:1}}>OFFICIAL RULES</span></div>
     <div style=${{padding:"22px 20px"}}>
      <div style=${{fontSize:24,fontWeight:700,fontFamily:"'Oswald','Arial Narrow',sans-serif",marginBottom:14}}>WINS ARE ALL THAT MATTER</div>
      ${[
       ["THE GAME","4 managers draft 7 NBA teams each. Most combined regular season wins across all 7 teams wins the league."],
       ["DRAFT","Snake draft, 7 rounds, 28 of 30 NBA teams. 2026-27 order: Swaggy, Gallup, Gainzy, Rippe. Nets and Kings go undrafted."],
       ["SCORING","Every regular season win counts as 1 win. Losses count for nothing. Season runs Oct 20 to Apr 11."],
       ["TIEBREAKER","If tied on total wins, the manager whose single best team has the most wins takes it."],
       ["REG SEASON POT","$50 buy-in. Most wins at season's end takes $150."],
       ["NBA CUP SIDE BET","$25 buy-in. Own the NBA Cup champion (final Dec 11) and take the $75 pot."],
       ["NBA FINALS SIDE BET","$25 buy-in. Own the NBA Finals champion and take the $75 pot."]
      ].map(function(r){return html`<div key=${r[0]} style=${{marginBottom:14}}><div className="fine" style=${{fontWeight:800,color:G,letterSpacing:1}}>${r[0]}</div><div style=${{fontSize:14,marginTop:2,lineHeight:1.5}}>${r[1]}</div></div>`})}
     </div>
    </div>
    <div style=${{marginTop:12,background:"var(--bar)",borderRadius:12,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
     <div>
      <div className="fine" style=${{color:GA,fontWeight:800,letterSpacing:2}}>SUPPORT THE LEAGUE</div>
      <div style=${{fontWeight:800,color:"var(--on-bar)",marginTop:2}}>Buy the Commissioner a Coffee <span className="fine" style=${{color:"var(--on-bar)"}}>@michaelrippe</span></div>
     </div>
     <a href="https://venmo.com/michaelrippe?txn=pay&amount=1&note=NBA%20Team%20League%20Support" target="_blank" rel="noopener noreferrer" style=${{display:"inline-flex",alignItems:"center",gap:8,background:"#0057B8",color:"#fff",textDecoration:"none",padding:"10px 18px",borderRadius:24,fontWeight:800,minHeight:44}}> $1 via Venmo</a>
    </div>
    <div className="card" style=${{marginTop:12}}>
     <${Hd} r="SIGN UP FOR EARLY ACCESS">COMING SOON · MORE LEAGUES</${Hd}>
     <div style=${{padding:"16px"}}>
      <div style=${{display:"flex",gap:12,marginBottom:12,flexWrap:"wrap"}}>
       ${[{name:"MLB",when:"Spring 2027"},{name:"NFL",when:"Fall 2027"},{name:"NHL",when:"Fall 2027"}].map(function(lg){var sel=sign.leagues.indexOf(lg.name)>=0;return html`<button type="button" key=${lg.name} onClick=${function(){toggleLeague(lg.name)}} style=${{padding:"10px 14px",borderRadius:10,border:sel?"2px solid "+G:"1px solid var(--line)",background:"var(--paper)",minHeight:44}}>
        <div style=${{fontWeight:800}}>${lg.name}</div><div className="badge" style=${{color:sel?GR:GY}}>${sel?"SELECTED":lg.when}</div>
       </button>`})}
      </div>
      ${sign.sent?html`<div className="fine" style=${{color:GR,fontWeight:800}}>You're on the list.</div>`:html`<div style=${{display:"flex",gap:8,flexWrap:"wrap"}}>
       <input value=${sign.name} aria-label="Name" placeholder="Name" onChange=${function(e){var v=e.target.value;setSign(function(s){return Object.assign({},s,{name:v})})}} style=${{flex:1,minWidth:120,padding:"10px 12px",border:"1px solid var(--line)",borderRadius:6}} />
       <input value=${sign.email} aria-label="Email" placeholder="Email" type="email" onChange=${function(e){var v=e.target.value;setSign(function(s){return Object.assign({},s,{email:v})})}} style=${{flex:2,minWidth:160,padding:"10px 12px",border:"1px solid var(--line)",borderRadius:6}} />
       <button type="button" className="share-btn" disabled=${!sign.name.trim()||!sign.email.trim()} onClick=${submitSignup}>SIGN UP</button>
      </div>`}
     </div>
    </div>
   </div>`:null}
  </div>
  <section id="interest" className="interest-card" aria-labelledby="interest-title">
   <h2 id="interest-title">Want in next season?</h2>
   <p className="sub">Get updates on new Team League games, the app, and how to join.</p>
   ${intDone?html`<p role="status" style=${{fontWeight:800}}>You're on the list. Thanks!</p>`:html`<form className="interest-form" onSubmit=${submitInterest} noValidate>
    <label className="hp" aria-hidden="true">Website<input name="website" tabIndex="-1" autoComplete="off" value=${intWeb} onChange=${function(e){setIntWeb(e.target.value)}} /></label>
    <label>Name<input name="name" maxLength="60" autoComplete="name" value=${intName} onChange=${function(e){setIntName(e.target.value)}} /></label>
    <label>Email<input name="email" type="email" required maxLength="120" autoComplete="email" value=${intEmail} onChange=${function(e){setIntEmail(e.target.value)}} /></label>
    <button type="submit" className="share-btn" disabled=${intBusy}>${intBusy?"Sending…":"Notify me"}</button>
    ${intErr?html`<p className="fine" role="alert" style=${{flexBasis:"100%",color:RD,fontWeight:700}}>${intErr}</p>`:null}
   </form>`}
  </section>
  <div className="floor-note">NBA Team League 2026-27 · Est. 2024 · $300 Prize Pool · Defending Champ: Gainzy</div>
 </div>`;
}
window.__nbatl={parseStandings:parseStandings,seasonLocked:seasonLocked,afterApr11:afterApr11,allPlayed82:allPlayed82,buildCup:buildCup,parseCupPayloads:parseCupPayloads,teamGames:teamGames,TOTAL_GAMES:TOTAL_GAMES,ESPN_URL:ESPN_URL};
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
